<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Астемир Шебзухов</title>
    <meta name="description"
        content="Астемир Шебзухов — научный журналист, генеалог, преподаватель черкесского языка. Исследователь адыгской культуры, истории и языка." />
    <meta name="author" content="Астемир Шебзухов" />

    <!-- Open Graph — works for VK, OK, WhatsApp, LinkedIn, Telegram, Facebook -->
    <meta property="og:type"        content="website" />
    <meta property="og:url"         content="https://shebzukho.com/" />
    <meta property="og:site_name"   content="Астемир Шебзухов" />
    <meta property="og:locale"      content="ru_RU" />
    <meta property="og:title"       content="Астемир Шебзухов" />
    <meta property="og:description"
        content="Научный журналист · Генеалог · Преподаватель черкесского языка" />
    <meta property="og:image"       content="https://shebzukho.com/assets/photo.jpg" />
    <meta property="og:image:width"  content="750" />
    <meta property="og:image:height" content="750" />
    <meta property="og:image:type"   content="image/jpeg" />
    <meta property="og:image:alt"    content="Астемир Шебзухов — научный журналист, генеалог, преподаватель черкесского языка" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card"        content="summary" />
    <meta name="twitter:title"       content="Астемир Шебзухов" />
    <meta name="twitter:description"
        content="Научный журналист · Генеалог · Преподаватель черкесского языка" />
    <meta name="twitter:image"       content="https://shebzukho.com/assets/og-preview.png" />
    <meta name="twitter:image:alt"   content="Астемир Шебзухов" />

    <link rel="canonical" href="https://shebzukho.com/" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <link rel="apple-touch-icon" href="/assets/favicon.svg" />

    <meta name="theme-color" content="#2d6a4f" />

    <link rel="stylesheet" href="/src/css/style.css" />
    <!-- Apply saved theme before body paints — prevents flash -->
    <script>!function(){var t=localStorage.getItem('theme');t?document.documentElement.setAttribute('data-theme',t):window.matchMedia('(prefers-color-scheme: dark)').matches&&document.documentElement.setAttribute('data-theme','dark')}();</script>
    <script src="/src/js/theme-config.js"></script>
</head>

<body>
    <!-- Scroll progress bar -->
    <div class="scroll-progress" id="scrollProgress" aria-hidden="true"></div>

    <!-- Navbar — populated by render.js -->
    <nav class="navbar" role="navigation" aria-label="Основная навигация"></nav>

    <!-- Main content — sections appended by render.js -->
    <main id="main">
        <div class="loading" id="loading-indicator">Загрузка</div>
        <div id="all-sections"></div>
    </main>

    <!-- Footer — populated by render.js -->
    <footer class="footer" id="site-footer"></footer>

    <!-- Back to top -->
    <button class="back-to-top" id="backToTop" aria-label="Наверх">↑</button>

    <!--
        Load order matters:
          1. render.js  – async fetches content.json, builds DOM, then calls initPage()
          2. main.js    – defines initPage() synchronously (ready before fetch resolves)
    -->
    <script src="/src/js/render.js"></script>
    <script src="/src/js/main.js"></script>
</body>

</html>
