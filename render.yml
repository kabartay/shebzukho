services:
  - type: web
    name: shebzukho
    runtime: static
    buildCommand: ""
    staticPublishPath: public
    headers:
      # Security headers
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      # CSS/JS — no-cache so browsers always revalidate; filenames are static (no hash)
      - path: /src/css/*
        name: Cache-Control
        value: public, no-cache
      - path: /src/js/*
        name: Cache-Control
        value: public, no-cache
      # Images/fonts — 1 day, no immutable (no build-step hash in filenames)
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=86400
      # Content — short cache so edits to content.json go live quickly
      - path: /data/*
        name: Cache-Control
        value: public, max-age=300
      # HTML — revalidate on each visit
      - path: /*.html
        name: Cache-Control
        value: public, max-age=3600
